[project]
name = "cet-mcp"
version = "0.1.0"
description = "四六级备考题库 / 错题本 MCP 服务器（SM-2 间隔重复）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
cet-mcp = "cet_mcp.server:main"
cet-mcp-setup = "cet_mcp.vocab_source:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cet_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
